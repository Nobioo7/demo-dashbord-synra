version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
    restart: always

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../dashboard/.env.local
    environment:
      - SYNRA_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  agentmemory:
    image: node:20-alpine
    working_dir: /agentmemory
    command: [ "sh", "-c", "npx -y @agentmemory/agentmemory@latest" ]
    ports:
      - "3111:3111"
    restart: always
